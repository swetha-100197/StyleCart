
name: StyleCart CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    env:
      DB_MODE: local
      DB_USER: postgres
      DB_HOST: localhost
      DB_NAME: stylecart_db
      DB_PASSWORD: postgres
      DB_PORT: 5432

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stylecart_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check backend JavaScript syntax
        working-directory: ./backend
        run: node --check server.js

      - name: Create database table
        working-directory: ./backend
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d stylecart_db -f queries.sql

      - name: Run automated tests
        working-directory: ./backend
        run: npm test

  deploy_backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Trigger Render deployment
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy_frontend:
    name: Deploy Frontend to Cloudflare
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Trigger Cloudflare Pages deployment
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
