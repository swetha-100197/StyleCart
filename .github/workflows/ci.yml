
name: StyleCart CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
     DB_MODE: local
     DB_USER: postgres
     DB_HOST: localhost
     DB_NAME: stylecart_db
     DB_PASSWORD: postgres
     DB_PORT: 5432

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stylecart_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check backend JavaScript syntax
        working-directory: ./backend
        run: node --check server.js

      - name: Create database table
        working-directory: ./backend
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d stylecart_db -f queries.sql

      - name: Run automated tests
        working-directory: ./backend
        run: npm test
