
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleCart - Online Dress Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>StyleCart</h1>
        <p>Your Everyday Fashion Store</p>
    </header>

   
<main>
    <h2>Add a New Dress</h2>

    <form id="product-form">
        <input
            type="text"
            id="product-name"
            placeholder="Enter dress name"
            required
        >

        <input
            type="number"
            id="product-price"
            placeholder="Enter dress price"
            min="0.01"
            step="0.01"
            required
        >

        <button type="submit">Add Dress</button>
    </form>

    <h2>Our Latest Dresses</h2>

    <div id="products-container">
        Loading products...
    </div>
</main>


    <script src="script.js"></script>
</body>
</html>
